<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#1e90ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#020617"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-dasharray="8 4" opacity="0.6"/>
  <!-- Futuristic RP monogram -->
  <path d="M30 72 V28 H48 C58 28 62 33 62 42 C62 50 56 54 48 54 H30 M45 54 L62 72" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="50" cy="20" r="3" fill="#00e5ff" filter="url(#glow)" />
  <circle cx="80" cy="50" r="2.5" fill="#1e90ff" />
  <circle cx="50" cy="80" r="3" fill="#00e5ff" filter="url(#glow)" />
  <circle cx="20" cy="50" r="2.5" fill="#1e90ff" />
</svg>

